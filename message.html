<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Set Announcement on Frame</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0A0A0C;
      color: #E0E0E0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background-color: #1C1C1E;
      border-radius: 22px;
      padding: 32px 24px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      border: 1px solid #2C2C2E;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: #FFFFFF;
      font-weight: 700;
      text-align: center;
      background: linear-gradient(135deg, #007AFF, #5856D6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 14px;
      color: #8E8E93;
      margin-bottom: 24px;
      text-align: center;
      line-height: 1.5;
    }
    .field-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
    }
    label {
      font-size: 13px;
      color: #8E8E93;
      margin-bottom: 8px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input[type="text"] {
      width: 100%;
      height: 54px;
      padding: 16px;
      border: 1px solid #2C2C2E;
      background-color: #121216;
      color: #FFFFFF;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s, box-shadow 0.2s;
      display: block;
    }
    input[type="text"]:focus {
      border-color: #007AFF;
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.15);
    }
    input[disabled] {
      opacity: 0.5;
      cursor: not-allowed;
    }
    textarea {
      width: 100%;
      min-height: 110px;
      padding: 16px;
      border: 1px solid #2C2C2E;
      background-color: #121216;
      color: #FFFFFF;
      border-radius: 12px;
      font-size: 16px;
      line-height: 1.5;
      outline: none;
      box-sizing: border-box;
      resize: vertical;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: inherit;
      display: block;
    }
    textarea:focus {
      border-color: #007AFF;
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.15);
    }
    .char-count {
      text-align: right;
      font-size: 12px;
      color: #636366;
      margin-top: 6px;
    }
    .emoji-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .emoji-pill {
      background-color: #2C2C2E;
      border: 1px solid #3A3A3C;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 18px;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
      user-select: none;
    }
    .emoji-pill:active {
      transform: scale(0.9);
      background-color: #3A3A3C;
    }
    .action-row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      width: 100%;
    }
    .btn-secondary {
      flex: 1;
      height: 48px;
      background-color: #2C2C2E;
      border: 1px solid #3A3A3C;
      color: #FFFFFF;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.2s;
    }
    .btn-secondary:active {
      background-color: #3A3A3C;
    }
    .btn-primary {
      width: 100%;
      height: 52px;
      margin-top: 12px;
      background: linear-gradient(135deg, #007AFF, #5856D6);
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(88, 86, 214, 0.2);
      transition: transform 0.1s, opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-primary:active {
      transform: scale(0.98);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .btn-remove {
      width: 100%;
      height: 46px;
      margin-top: 12px;
      background: transparent;
      border: 1px solid #FF453A;
      color: #FF453A;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-remove:active {
      background-color: rgba(255, 69, 58, 0.15);
    }
    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
      display: none;
    }
    .status.success {
      background-color: rgba(48, 209, 88, 0.15);
      color: #30D158;
      border: 1px solid rgba(48, 209, 88, 0.2);
      display: block;
    }
    .status.error {
      background-color: rgba(255, 69, 58, 0.15);
      color: #FF453A;
      border: 1px solid rgba(255, 69, 58, 0.2);
      display: block;
    }
    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: #48484A;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Post Announcement</h1>
    <p>Overlay a floating greeting or message across your Portal photo frame.</p>
    
    <div class="field-group">
      <label for="code">Broadcast Channel / Pairing Code</label>
      <input type="text" id="code" placeholder="e.g. portal_broadcast or 123456" autocomplete="off">
    </div>

    <div class="field-group">
      <label for="message">Announcement Message</label>
      <div class="emoji-row">
        <span class="emoji-pill" onclick="insertEmoji('🎉')">🎉</span>
        <span class="emoji-pill" onclick="insertEmoji('🎂')">🎂</span>
        <span class="emoji-pill" onclick="insertEmoji('❤️')">❤️</span>
        <span class="emoji-pill" onclick="insertEmoji('✨')">✨</span>
        <span class="emoji-pill" onclick="insertEmoji('🏡')">🏡</span>
        <span class="emoji-pill" onclick="insertEmoji('⭐')">⭐</span>
        <span class="emoji-pill" onclick="insertEmoji('🎄')">🎄</span>
        <span class="emoji-pill" onclick="insertEmoji('🎃')">🎃</span>
      </div>
      <textarea id="message" placeholder="e.g. Happy 30th Birthday Sarah! 🎂🎉" maxlength="200" oninput="updateCharCount()"></textarea>
      <div id="char-count" class="char-count">0 / 200</div>
      
      <div class="action-row">
        <button id="paste-btn" type="button" class="btn-secondary" onclick="pasteFromClipboard()">📋 Paste</button>
        <button id="clear-btn" type="button" class="btn-secondary" onclick="clearMessage()">✕ Clear</button>
      </div>

      <div class="field-group" style="margin-top: 16px;">
        <label for="showcase-select">📍 Showcase Photos on Frame</label>
        <select id="showcase-select" style="width: 100%; height: 50px; padding: 12px; background-color: #121216; color: #FFFFFF; border: 1px solid #2C2C2E; border-radius: 12px; font-size: 15px; outline: none; margin-bottom: 8px;" onchange="toggleCustomLocInput()">
          <option value="none">Keep current showcase mode</option>
          <option value="recent_trip">Showcase recent trip / visit</option>
          <option value="last_7_days">Showcase last 7 days</option>
          <option value="last_30_days">Showcase last 30 days</option>
          <option value="custom_location">Showcase specific city / location...</option>
          <option value="all">Reset to all photos</option>
        </select>
        <input type="text" id="custom-location-input" placeholder="e.g. Paris, London, Hawaii" style="display: none;" />
      </div>

      <button id="send-btn" type="button" class="btn-primary" onclick="sendMessage()">📢 Broadcast to Portals</button>
      <button id="remove-btn" type="button" class="btn-remove" onclick="removeAnnouncement()">Remove Active Banner</button>
    </div>

    <div id="status-box" class="status"></div>
  </div>
  <div class="footer">Portal Frame Screensaver</div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const codeParam = urlParams.get('channel') || urlParams.get('code');
    const keyParam = urlParams.get('key'); // Optional AES key

    if (codeParam) {
      const codeInput = document.getElementById('code');
      codeInput.value = codeParam;
      codeInput.disabled = true;
    }

    function insertEmoji(emoji) {
      const msg = document.getElementById('message');
      msg.value += emoji;
      msg.focus();
      updateCharCount();
    }

    function updateCharCount() {
      const msg = document.getElementById('message');
      document.getElementById('char-count').innerText = `${msg.value.length} / 200`;
    }

    function clearMessage() {
      const msg = document.getElementById('message');
      msg.value = '';
      msg.focus();
      updateCharCount();
    }

    async function pasteFromClipboard() {
      try {
        if (navigator.clipboard && navigator.clipboard.readText) {
          const text = await navigator.clipboard.readText();
          if (text) {
            document.getElementById('message').value = text;
            updateCharCount();
          }
        }
      } catch (_) {}
    }

    async function importKey(keyStr) {
      const enc = new TextEncoder();
      const keyBuf = enc.encode(keyStr);
      return await window.crypto.subtle.importKey(
        "raw", keyBuf, { name: "AES-CBC" }, false, ["encrypt"]
      );
    }

    async function encryptData(plaintext, keyStr) {
      try {
        const enc = new TextEncoder();
        const cryptoKey = await importKey(keyStr);
        const iv = window.crypto.getRandomValues(new Uint8Array(16));
        const encrypted = await window.crypto.subtle.encrypt(
          { name: "AES-CBC", iv: iv }, cryptoKey, enc.encode(plaintext)
        );
        const res = new Uint8Array(iv.length + encrypted.byteLength);
        res.set(iv, 0);
        res.set(new Uint8Array(encrypted), iv.length);
        return Array.from(res).map(b => b.toString(16).padStart(2, '0')).join('');
      } catch (e) {
        console.error("Encryption failed:", e);
        return '';
      }
    }

    function toggleCustomLocInput() {
      const mode = document.getElementById('showcase-select').value;
      const customInput = document.getElementById('custom-location-input');
      customInput.style.display = (mode === 'custom_location') ? 'block' : 'none';
      if (mode === 'custom_location') customInput.focus();
    }

    async function sendMessage() {
      let text = document.getElementById('message').value.trim();
      const showcaseMode = document.getElementById('showcase-select').value;
      if (showcaseMode === 'recent_trip') {
        text += (text ? ' ' : '') + '#showcase:recent_trip';
      } else if (showcaseMode === 'last_7_days') {
        text += (text ? ' ' : '') + '#showcase:last_7_days';
      } else if (showcaseMode === 'last_30_days') {
        text += (text ? ' ' : '') + '#showcase:last_30_days';
      } else if (showcaseMode === 'all') {
        text += (text ? ' ' : '') + '#showcase:all';
      } else if (showcaseMode === 'custom_location') {
        const loc = document.getElementById('custom-location-input').value.trim();
        if (loc) {
          text += (text ? ' ' : '') + '#showcase:' + loc;
        }
      }
      await sendPayload(text);
    }

    async function removeAnnouncement() {
      await sendPayload('__CLEAR__');
    }

    async function sendPayload(content) {
      const codeInput = document.getElementById('code');
      const btn = document.getElementById('send-btn');
      const statusBox = document.getElementById('status-box');

      statusBox.className = 'status';
      statusBox.style.display = 'none';

      const code = codeInput.value.trim();
      const aesKey = keyParam || 'PortalGlobal2026';

      if (!code) {
        statusBox.innerText = 'Please enter a valid pairing code or broadcast channel.';
        statusBox.classList.add('error');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Broadcasting...';

      const hex = await encryptData(content, aesKey);
      if (!hex) {
        statusBox.innerText = 'Encryption failed. Please try again.';
        statusBox.classList.add('error');
        btn.disabled = false;
        btn.innerText = '📢 Broadcast to Portals';
        return;
      }

      try {
        const response = await fetch(`https://keyvalue.immanuel.co/api/KeyVal/UpdateValue/cs79vqdm/${encodeURIComponent(code)}/${hex}`, {
          method: 'POST',
          headers: { 'Content-Length': '0' }
        });
        const result = await response.text();
        if (result === 'true') {
          if (content === '__CLEAR__') {
            statusBox.innerText = 'Announcement cleared across all connected Portals worldwide!';
            document.getElementById('message').value = '';
            updateCharCount();
          } else {
            statusBox.innerText = 'Success! Your announcement has been broadcast to all connected Portals!';
          }
          statusBox.classList.add('success');
        } else {
          statusBox.innerText = 'Could not update relay. Please try again.';
          statusBox.classList.add('error');
        }
      } catch (e) {
        statusBox.innerText = 'Network error. Please check your internet connection.';
        statusBox.classList.add('error');
      } finally {
        btn.disabled = false;
        btn.innerText = '📢 Broadcast to Portals';
      }
    }
  </script>
</body>
</html>
